<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer Breathing Progress Track -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#065f46" stroke-width="24"/>

  <!-- Active 60s Ring Arc -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1106" stroke-dashoffset="240" transform="rotate(-90 256 256)"/>

  <!-- Inner Serene Core -->
  <circle cx="256" cy="256" r="128" fill="#022c22" opacity="0.6"/>

  <!-- Hospital Cross / Heart Empathy Element -->
  <g fill="#ecfdf5" transform="translate(256 220) scale(1.1)">
    <!-- Stylized Heart with pulse -->
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(-12, -26) scale(2.2)" fill="#34d399"/>
  </g>

  <!-- Number 1' Text -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">1 min</text>
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">HUV</text>
</svg>
